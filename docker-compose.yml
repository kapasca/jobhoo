services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhoo
      POSTGRES_USER: jobhoo
      POSTGRES_PASSWORD: jobhoo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - jobhoo_pgdata:/var/lib/postgresql/data
      - ./internal/database/migrations/init-migrations.sh:/docker-entrypoint-initdb.d/00-run-migrations.sh
      - ./internal/database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 8070
      DATABASE_URL: postgres://jobhoo:jobhoo_dev_password@db:5432/jobhoo?sslmode=disable
      SESSION_SECRET: dev-only-secret-change-me
      AI_PROVIDER: mock
    ports:
      - "8070:8070"

volumes:
  jobhoo_pgdata:
