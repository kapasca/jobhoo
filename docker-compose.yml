services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobhoo
    volumes:
      - jobhoo_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/jobhoo?sslmode=disable"
      PORT: "8070"
    ports:
      - "8070:8070"
    volumes:
      - jobhoo_uploads:/app/uploads

  # One-off container to populate demo data. Run with:
  #   docker compose run --rm seed
  seed:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/jobhoo?sslmode=disable"
    volumes:
      - jobhoo_uploads:/app/uploads
    entrypoint: ["./seed"]
    profiles: ["tools"]

volumes:
  jobhoo_pgdata:
  jobhoo_uploads:
