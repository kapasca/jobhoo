{{define "job_card"}}
<a href="/jobs/{{.ID}}" class="card group flex flex-col gap-3 p-5 sm:p-6 hover:-translate-y-1">
    <div class="flex items-start justify-between gap-4">
        <div class="space-y-1">
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-brand-600">{{.Position}}</p>
            <h3 class="font-display text-lg font-bold tracking-tight text-slate-950 transition group-hover:text-brand-700">{{.Title}}</h3>
        </div>
        <span class="badge whitespace-nowrap border border-brand-100 bg-brand-50 text-brand-700">{{employmentLabel .EmploymentType}}</span>
    </div>
    <div class="flex flex-wrap gap-2 text-xs text-slate-600">
        <span class="badge border border-slate-200 bg-white">{{.Location}}</span>
        <span class="badge border border-slate-200 bg-white">{{arrangementLabel .WorkArrangement}}</span>
    </div>
    <div class="mt-auto flex items-center justify-between border-t border-slate-100 pt-3 text-xs text-slate-500">
        <span>Ditutup {{.ClosingDate.Format "2 Jan 2006"}}</span>
        <span class="font-semibold text-brand-600 transition group-hover:translate-x-0.5">Lihat detail →</span>
    </div>
</a>
{{end}}
