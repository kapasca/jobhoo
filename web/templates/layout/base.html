{{define "base"}}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} · JOBHOO{{else}}JOBHOO · Connecting Recruiters with Outstanding Talent{{end}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0B1020',
              paper: '#F7F4EE',
              brand: {
                50: '#FFF4E6',
                100: '#FFE3BF',
                200: '#FFC980',
                500: '#FF7A00',
                600: '#E56800',
                700: '#C95500'
              },
              slate: {
                950: '#0B1020'
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans','Inter','sans-serif'],
              display: ['Space Grotesk','Plus Jakarta Sans','sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .btn-primary {
        @apply inline-flex items-center justify-center rounded-full bg-brand-500 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-brand-500/20 transition duration-200 hover:-translate-y-0.5 hover:bg-brand-600 hover:shadow-xl hover:shadow-brand-500/25;
      }
      .btn-secondary {
        @apply inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-brand-200 hover:text-brand-700 hover:shadow-md;
      }
      .card {
        @apply rounded-[1.75rem] border border-white/70 bg-white/95 shadow-[0_20px_60px_-35px_rgba(11,16,32,0.35)] backdrop-blur transition duration-200;
      }
      .card:hover {
        @apply border-brand-100 shadow-[0_24px_70px_-35px_rgba(11,16,32,0.45)];
      }
      .input {
        @apply w-full rounded-2xl border border-slate-200 bg-white/95 px-4 py-3 text-sm shadow-sm outline-none transition focus:border-brand-300 focus:ring-4 focus:ring-brand-100;
      }
      .label {
        @apply mb-2 block text-sm font-semibold text-slate-700;
      }
      .badge {
        @apply inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold tracking-wide;
      }
      .section-kicker {
        @apply inline-flex items-center rounded-full border border-brand-200 bg-brand-50 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-brand-700;
      }
      .section-title {
        @apply font-display text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl;
      }
      .section-copy {
        @apply text-sm leading-6 text-slate-600 sm:text-base;
      }
      .page-wrap {
        @apply max-w-6xl mx-auto px-4 py-10 sm:px-6 sm:py-12 lg:py-14;
      }
      .page-head {
        @apply mb-6 sm:mb-8 flex items-center justify-between gap-3 flex-wrap;
      }
      .panel-dark {
        @apply rounded-[1.75rem] bg-slate-950 text-white shadow-[0_24px_70px_-35px_rgba(11,16,32,0.7)] border border-white/10;
      }
      .metric-card {
        @apply card p-4 sm:p-5;
      }
      .metric-label {
        @apply text-[11px] uppercase tracking-[0.18em] text-slate-500;
      }
      .metric-value {
        @apply mt-2 font-display text-3xl sm:text-4xl leading-none font-bold tracking-tight text-slate-950 tabular-nums;
      }
      .list-panel {
        @apply card divide-y divide-slate-100;
      }
      .list-row {
        @apply px-4 py-3.5 sm:px-5 sm:py-4;
      }
      .badge-count {
        @apply badge border border-brand-200 bg-brand-50 text-brand-700;
      }
      .status-open {
        @apply badge bg-brand-50 text-brand-700 border border-brand-100;
      }
      .status-closed {
        @apply badge bg-slate-200 text-slate-700;
      }
      .status-approved {
        @apply badge bg-emerald-50 text-emerald-700 border border-emerald-200;
      }
      .status-pending {
        @apply badge bg-amber-50 text-amber-700 border border-amber-200;
      }
      .status-rejected {
        @apply badge bg-rose-50 text-rose-700 border border-rose-200;
      }
      .status-muted {
        @apply badge bg-slate-100 text-slate-700 border border-slate-200;
      }
      .nav-pill {
        @apply rounded-full px-4 py-2 transition;
      }
      .nav-pill-dark {
        @apply text-white/80 hover:bg-white/10 hover:text-white;
      }
      .nav-pill-light {
        @apply border border-white/15 bg-white/5 px-3 py-1.5 text-white/80 hover:bg-white/10;
      }
      .nav-pill-active {
        @apply bg-brand-500 text-white hover:bg-brand-500;
      }
      .quick-link {
        @apply inline-flex items-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-brand-200 hover:text-brand-700;
      }
    </style>
</head>
<body class="relative isolate min-h-screen flex flex-col overflow-x-hidden bg-[#F5F4F1] text-slate-900 font-sans">
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-20 overflow-hidden">
        <div class="absolute -top-24 -left-24 h-80 w-80 rounded-full bg-brand-500/15 blur-3xl"></div>
        <div class="absolute top-24 -right-28 h-96 w-96 rounded-full bg-slate-950/10 blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 h-72 w-72 rounded-full bg-brand-100/60 blur-3xl"></div>
    </div>
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 bg-[linear-gradient(to_right,rgba(15,23,42,0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(15,23,42,0.03)_1px,transparent_1px)] bg-[size:36px_36px] opacity-55"></div>

    {{template "navbar" .}}

    <div class="relative z-10">
        {{if .Flash}}
        <div class="max-w-6xl mx-auto w-full px-6 mt-4">
            <div class="rounded-2xl border border-brand-200 bg-brand-50 px-4 py-3 text-sm font-medium text-brand-700 shadow-sm">{{.Flash}}</div>
        </div>
        {{end}}
        {{if .Error}}
        <div class="max-w-6xl mx-auto w-full px-6 mt-4">
            <div class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700 shadow-sm">{{.Error}}</div>
        </div>
        {{end}}

        <main class="flex-1">
            {{template "content" .}}
        </main>
    </div>

    {{template "footer" .}}

    <script>
      (function () {
        var path = window.location.pathname;
        var links = document.querySelectorAll('[data-nav]');
        links.forEach(function (link) {
          var href = link.getAttribute('href');
          var match = link.getAttribute('data-match') || 'prefix';
          var active = false;

          if (!href) return;

          if (match === 'exact') {
            active = path === href;
          } else {
            active = path === href || path.indexOf(href + '/') === 0;
          }

          if (active) {
            link.classList.add('nav-pill-active');
          }
        });
      })();
    </script>
</body>
</html>
{{end}}
