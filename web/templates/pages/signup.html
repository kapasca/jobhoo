{{define "title"}}Sign up — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm container-padding-auth">
  <div class="card card--pad-lg">
    <h2 class="text-center">Create your account</h2>
    <p class="text-center mb-5">Join JOBHOO as a candidate or a recruiter.</p>

    {{if .Error}}
      <div class="alert alert--warning mb-4">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/signup">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field">
        <label>I am a...</label>
        <div class="signup-role-group">
          <label class="filter-chip signup-role-label {{if ne .Role "recruiter"}}is-active{{end}}">
            <input type="radio" name="role" value="candidate" {{if ne .Role "recruiter"}}checked{{end}} class="signup-role-input"> Candidate
          </label>
          <label class="filter-chip signup-role-label {{if eq .Role "recruiter"}}is-active{{end}}">
            <input type="radio" name="role" value="recruiter" {{if eq .Role "recruiter"}}checked{{end}} class="signup-role-input"> Recruiter
          </label>
        </div>
      </div>
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{.FullName}}" placeholder="Jane Doe" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
        <span class="field__hint">Use at least 8 characters.</span>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Create account</button>
    </form>

    <p class="signup-footer-link">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</section>
{{end}}
