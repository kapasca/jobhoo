{{define "title"}}Sign up — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm container-padding-auth">
  <div class="card card--pad-lg">
    <h2 class="text-center">Create Account</h2>
    <p class="text-center mb-5">Join JOBHOO as a candidate or a recruiter.</p>

    {{if .Error}}
      <div class="alert alert--warning mb-4">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/signup" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field">
        <label>I am a...</label>
        <div class="signup-role-group">
          <label class="filter-chip signup-role-label {{if ne .Role "recruiter"}}is-active{{end}}" id="role-candidate-label">
            <input type="radio" name="role" value="candidate" {{if ne .Role "recruiter"}}checked{{end}} class="signup-role-input"> Candidate
          </label>
          <label class="filter-chip signup-role-label {{if eq .Role "recruiter"}}is-active{{end}}" id="role-recruiter-label">
            <input type="radio" name="role" value="recruiter" {{if eq .Role "recruiter"}}checked{{end}} class="signup-role-input"> Recruiter / Company
          </label>
        </div>
      </div>
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{.FullName}}" placeholder="Jane Doe" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="field__input-group">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
          <span class="field__hint">Use at least 8 characters.</span>
        </div>
      </div>
      <div class="field" id="resume-section" {{if eq .Role "recruiter"}}style="display:none"{{end}}>
        <label>Resume</label>
        <div class="field__input-group">
          <input type="file" name="resume_file" accept=".pdf,.docx,.txt">
          <span class="field__hint">Required for candidates — PDF, DOCX, or TXT, max 5 MB.</span>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Create account</button>
    </form>

    <p class="signup-footer-link">
      Already have an account? <a href="/login">Sign In</a>
    </p>
  </div>
</section>
<script>
(function () {
  var labels = document.querySelectorAll('.signup-role-label');
  var resumeSection = document.getElementById('resume-section');
  document.querySelectorAll('.signup-role-input').forEach(function (radio) {
    radio.addEventListener('change', function () {
      labels.forEach(function (l) {
        l.classList.toggle('is-active', l.querySelector('input').checked);
      });
      if (resumeSection) {
        resumeSection.style.display = this.value === 'candidate' ? '' : 'none';
      }
    });
  });
})();
</script>
{{end}}
