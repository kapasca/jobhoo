{{define "title"}}Verify Your Email — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm mt-7">
  <div class="card card--pad-lg text-center">
    <h2 class="text--center">Success!</h2>
    {{if .Error}}
      <strong>Verification Failed</strong>
      <p class="text-muted font-xs">{{.Error}}</p>
      <p class="mt-3"><a href="/login">Return to Login</a></p>
    {{else}}
      <strong class="text-orange">Email Verified Successfully</strong>
      <p class="text-muted font-xs">Your account is now fully activated.</p>
      <button hx-get="/login" hx-target="body" hx-swap="beforeend" class="btn btn--primary mt-3">Sign In</button>
    {{end}}
  </div>
</section>
{{end}}
