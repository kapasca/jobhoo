{{define "title"}}Forgot Password — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm">
  <div class="card card--pad-lg">
    <h1 class="text--center">Reset Your Password</h1>
    
    {{if .Error}}
      <div class="alert alert--info">
        <p>{{.Error}}</p>
      </div>
    {{else}}
      <p style="text-align: center; color: var(--color-text-secondary); margin-bottom: 1.5rem;">
        Enter your email address and we'll send you a link to reset your password.
      </p>
    {{end}}

    <form method="post" action="/forgot-password">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      
      <div class="field">
        <label for="email">Email Address</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          placeholder="your@email.com"
          required
          autocomplete="email"
        >
        <small style="color: var(--color-text-secondary);">We'll send a reset link to this email</small>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Send Reset Link</button>
      
      <p style="text-align: center; margin-top: 1.5rem;">
        <a href="/login" style="color: var(--color-primary); text-decoration: none;">Back to login</a>
      </p>
    </form>
  </div>
</section>
{{end}}
