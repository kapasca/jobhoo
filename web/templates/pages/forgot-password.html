{{define "title"}}Forgot Password — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm mt-7">
  <a href="/" class="ats-back-link">← Back to Homepage</a>
  <div class="card card--pad-lg mt-3 pt-5 pb-6">
    <h2>Reset Password</h2>
    
    {{if .Error}}
      <div class="alert alert--info">
        <p>{{.Error}}</p>
      </div>
    {{else}}
      <p class="text-muted font-sm mb-6">
        We'll send you a link to reset password.
      </p>
    {{end}}

    <form method="post" action="/forgot-password">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      
      <div class="field mb-4">
        <label for="email">Email Address</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          placeholder="your@email.com"
          required
          autocomplete="email"
        >
      </div>

      <button class="btn btn--primary btn--block p-2" type="submit">Send Reset Link</button>
      
    </form>
  </div>
</section>
{{end}}
