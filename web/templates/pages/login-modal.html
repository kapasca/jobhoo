{{define "login-modal"}}
<div class="modal-wrapper">
  <div class="modal-backdrop" onclick="this.closest('.modal-wrapper')?.remove()"></div>
  <div class="modal modal-max-sm">
    <script>
      function togglePasswordVisibility(e) {
        e.preventDefault();
        var input = e.target.closest('.password-toggle').parentElement.querySelector('input');
        var eyeOpen = e.target.closest('.password-toggle').querySelector('.eye-open');
        var eyeClosed = e.target.closest('.password-toggle').querySelector('.eye-closed');
        if (input.type === 'password') {
          input.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
        } else {
          input.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
        }
      }
      // Close modal on Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.querySelector('.modal-wrapper')?.remove();
        }
      });
      // Prevent body scroll when modal is open
      document.body.style.overflow = 'hidden';
      // Re-enable body scroll when modal is closed
      const observer = new MutationObserver(() => {
        if (!document.querySelector('.modal-wrapper')) {
          document.body.style.overflow = 'auto';
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true });
    </script>

    <!-- Header -->
    <div class="login-modal-header">
      <h2 class="login-modal-title">Sign in to JOBHOO</h2>
      <button class="modal-close" onclick="this.closest('.modal-wrapper')?.remove()" title="Close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="login-modal-content">
      {{if .Error}}
        <div class="alert alert--warning login-modal-error">{{.Error}}</div>
      {{end}}

      <form method="POST" action="/login" hx-post="/login" hx-target="closest .modal-wrapper" hx-swap="outerHTML">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="next" value="{{.NextURL}}">

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" value="{{.Email}}" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility(event)" aria-label="Show/hide password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-open">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-closed" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn-full-width mb-3 mt-7">Sign In</button>

        <p class="login-modal-signup-link">
          New to JOBHOO? <a href="/signup">Create an Account</a>
        </p>
      </form>
    </div>
  </div>
</div>
{{end}}
