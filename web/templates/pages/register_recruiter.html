{{define "content"}}
<section class="page-wrap max-w-2xl">
    <div class="card p-8 lg:p-10">
    <h1 class="section-title text-center">Recruiter Signup</h1>
    <p class="section-copy text-center mt-2">Perlu approval admin.</p>

    <form method="POST" action="/register/recruiter" enctype="multipart/form-data" class="mt-8 space-y-4">
        <div>
            <label class="label" for="company_name">Nama Perusahaan</label>
            <input class="input" type="text" id="company_name" name="company_name" required>
        </div>
        <div>
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" required>
        </div>
        <div>
            <label class="label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" minlength="8" required>
        </div>
        <div>
            <label class="label" for="document">Dokumen Pendukung (PDF)</label>
            <input class="input" type="file" id="document" name="document" accept="application/pdf" required>
        </div>
        <button type="submit" class="btn-primary w-full py-3">Ajukan</button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
        Sudah punya akun? <a href="/login" class="text-brand-700 font-semibold underline underline-offset-4">Masuk</a>
    </p>
    </div>
</section>
{{end}}
