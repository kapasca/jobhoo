{{define "title"}}Reset Password — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm">
  <div class="card card--pad-lg">
    <h1 class="text--center">Set New Password</h1>
    
    {{if .Error}}
      <div class="alert alert--warning">
        <strong>Reset Failed</strong>
        <p>{{.Error}}</p>
        <p style="margin-top: 0.5rem;">
          <a href="/forgot-password">Request a new reset link</a>
        </p>
      </div>
    {{else}}
      <p style="text-align: center; color: var(--color-text-secondary); margin-bottom: 1.5rem;">
        Enter a new password for your account.
      </p>
    {{end}}

    <form method="post" action="/reset-password">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="token" value="{{.Token}}">
      
      <div class="field">
        <label for="password">New Password</label>
        <div class="password-field">
          <input 
            id="password" 
            name="password" 
            type="password" 
            placeholder="At least 8 characters"
            required
            minlength="8"
          >
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility(event)" aria-label="Show/hide password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-open">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-closed" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <small style="color: var(--color-text-secondary);">Must be at least 8 characters</small>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Reset Password</button>
      
      <p style="text-align: center; margin-top: 1.5rem;">
        <a href="/login" class="ats-back-link">← Back to Login</a>
      </p>
    </form>
  </div>
</section>
<script>
function togglePasswordVisibility(e) {
  e.preventDefault();
  var input = e.target.closest('.password-toggle').parentElement.querySelector('input');
  var eyeOpen = e.target.closest('.password-toggle').querySelector('.eye-open');
  var eyeClosed = e.target.closest('.password-toggle').querySelector('.eye-closed');
  if (input.type === 'password') {
    input.type = 'text';
    eyeOpen.style.display = 'none';
    eyeClosed.style.display = 'block';
  } else {
    input.type = 'password';
    eyeOpen.style.display = 'block';
    eyeClosed.style.display = 'none';
  }
}
</script>
{{end}}
