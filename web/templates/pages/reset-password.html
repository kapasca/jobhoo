{{define "title"}}Reset Password — JOBHOO{{end}}

{{define "content"}}
<section class="container container-max-sm">
  <div class="card card--pad-lg">
    <h1 class="text--center">Set New Password</h1>
    
    {{if .Error}}
      <div class="alert alert--warning">
        <strong>Reset Failed</strong>
        <p>{{.Error}}</p>
        <p style="margin-top: 0.5rem;">
          <a href="/forgot-password">Request a new reset link</a>
        </p>
      </div>
    {{else}}
      <p style="text-align: center; color: var(--color-text-secondary); margin-bottom: 1.5rem;">
        Enter a new password for your account.
      </p>
    {{end}}

    <form method="post" action="/reset-password">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="token" value="{{.Token}}">
      
      <div class="field">
        <label for="password">New Password</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          placeholder="At least 8 characters"
          required
          minlength="8"
        >
        <small style="color: var(--color-text-secondary);">Must be at least 8 characters</small>
      </div>

      <button class="btn btn--primary btn--block" type="submit">Reset Password</button>
      
      <p style="text-align: center; margin-top: 1.5rem;">
        <a href="/login" class="ats-back-link">← Back to Login</a>
      </p>
    </form>
  </div>
</section>
{{end}}
