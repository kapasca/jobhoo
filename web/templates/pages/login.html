{{define "title"}}Log in — JOBHOO{{end}}

{{define "content"}}
<section class="container login-page-section">
  <div class="card card--pad-lg">
    <h2 class="login-page-title">Welcome back</h2>
    <p class="login-page-subtitle">Log in to continue to JOBHOO.</p>

    {{if .Error}}
      <div class="alert alert--warning mb-4">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="next" value="{{.NextURL}}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Log in</button>
    </form>

    <p class="login-page-footer">
      New to JOBHOO? <a href="/signup">Create an account</a>
    </p>
  </div>
</section>
{{end}}
