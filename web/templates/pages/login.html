{{define "content"}}
<section class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-12 lg:py-20">
    <div class="grid items-stretch gap-6 lg:grid-cols-[0.95fr_1.05fr]">
        <div class="card overflow-hidden bg-slate-950 p-8 text-white shadow-[0_30px_80px_-30px_rgba(11,16,32,0.8)]">
            <div class="flex h-full flex-col justify-between gap-10">
                <div>
                    <span class="section-kicker border-white/10 bg-white/10 text-white">Welcome back</span>
                    <img src="/static/img/jobhoo-title-desc.png" alt="JOBHOO" class="mt-6 h-16 w-auto object-contain">
                    <p class="mt-5 max-w-md text-sm leading-7 text-white/75">Masuk dan lanjutkan proses hiring.</p>
                </div>
                <div class="grid gap-4 sm:grid-cols-2">
                    <div class="rounded-[1.5rem] border border-white/10 bg-white/[0.08] p-5">
                        <div class="text-sm font-semibold">Candidate</div>
                        <p class="mt-2 text-sm leading-6 text-white/75">Apply, track, done.</p>
                    </div>
                    <div class="rounded-[1.5rem] border border-white/10 bg-white/[0.08] p-5">
                        <div class="text-sm font-semibold">Recruiter</div>
                        <p class="mt-2 text-sm leading-6 text-white/75">Post, screen, decide.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card p-8 lg:p-10">
            <div class="max-w-md">
                <h1 class="section-title">Masuk ke JOBHOO</h1>
                <p class="section-copy mt-3">Akses akun Anda.</p>

                <form method="POST" action="/login" class="mt-8 space-y-5">
                    <div>
                        <label class="label" for="email">Email</label>
                        <input class="input" type="email" id="email" name="email" required autofocus>
                    </div>
                    <div>
                        <label class="label" for="password">Password</label>
                        <input class="input" type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary w-full py-3">Masuk</button>
                </form>

                <p class="mt-6 text-sm text-slate-500">
                    Belum punya akun? <a href="/register" class="font-semibold text-slate-950 underline decoration-brand-300 underline-offset-4">Daftar</a>
                </p>
            </div>
        </div>
    </div>
</section>
{{end}}
