{{define "title"}}Sign in — JOBHOO{{end}}

{{define "content"}}
<section class="container login-page-section">
  <div class="card card--pad-lg">
    <h2 class="login-page-title">Welcome back</h2>
    <p class="login-page-subtitle">Sign in to continue to JOBHOO.</p>

    {{if .Error}}
      <div class="alert alert--warning mb-4">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="next" value="{{.NextURL}}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
      <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility(event)" aria-label="Show/hide password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-open">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-closed" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn-full-width mb-3 mt-7">Sign In</button>
    </form>

    <p class="login-page-footer">
      New to JOBHOO? <a href="/signup">Create an Account</a>
    </p>
    
    {{if .Error}}
    <p class="login-page-footer">
      <a href="/forgot-password">Forgot your password?</a>
    </p>
    {{end}}
  </div>
</section>
<script>
function togglePasswordVisibility(e) {
  e.preventDefault();
  var input = e.target.closest('.password-toggle').parentElement.querySelector('input');
  var eyeOpen = e.target.closest('.password-toggle').querySelector('.eye-open');
  var eyeClosed = e.target.closest('.password-toggle').querySelector('.eye-closed');
  if (input.type === 'password') {
    input.type = 'text';
    eyeOpen.style.display = 'none';
    eyeClosed.style.display = 'block';
  } else {
    input.type = 'password';
    eyeOpen.style.display = 'block';
    eyeClosed.style.display = 'none';
  }
}
</script>
{{end}}
