{{define "title"}}Log in — JOBHOO{{end}}

{{define "content"}}
<section class="container" style="max-width:440px;padding:var(--jh-space-8) var(--jh-space-5);">
  <div class="card card--pad-lg">
    <h2 style="text-align:center;">Welcome back</h2>
    <p style="text-align:center;margin-bottom:var(--jh-space-5);">Log in to continue to JOBHOO.</p>

    {{if .Error}}
      <div class="alert alert--warning" style="margin-bottom:var(--jh-space-4);">{{.Error}}</div>
    {{end}}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="next" value="{{.NextURL}}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Email}}" placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Log in</button>
    </form>

    <p style="text-align:center;margin-top:var(--jh-space-5);font-size:var(--jh-text-sm);">
      New to JOBHOO? <a href="/signup" style="color:var(--jh-orange-500);font-weight:600;">Create an account</a>
    </p>
  </div>
</section>
{{end}}
