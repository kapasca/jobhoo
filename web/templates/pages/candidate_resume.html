{{define "content"}}
<section class="page-wrap max-w-2xl">
    <div class="card p-8 lg:p-10">
        <h1 class="section-title">Resume</h1>
        <p class="section-copy mt-2 truncate">{{.Profile.ResumeFilename}}</p>

        <form method="POST" action="/resume" enctype="multipart/form-data" class="mt-8 space-y-4">
            <div>
                <label class="label" for="resume">Upload PDF</label>
                <input class="input" type="file" id="resume" name="resume" accept="application/pdf" required>
            </div>
            <button type="submit" class="btn-primary w-full py-3">Perbarui</button>
        </form>
    </div>
</section>
{{end}}
