{{define "content"}}
<section class="page-wrap max-w-3xl">
    <div class="card p-8 lg:p-10">
    <h1 class="section-title">{{if .IsEdit}}Edit Lowongan{{else}}Buat Lowongan{{end}}</h1>

    <form method="POST" action="{{.FormAction}}" class="mt-8 space-y-5">
        <div>
            <label class="label" for="title">Job Title</label>
            <input class="input" type="text" id="title" name="title" value="{{if .Job}}{{.Job.Title}}{{end}}" required>
        </div>
        <div>
            <label class="label" for="position">Position</label>
            <input class="input" type="text" id="position" name="position" value="{{if .Job}}{{.Job.Position}}{{end}}" required>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
            <div>
                <label class="label" for="employment_type">Employment Type</label>
                <select class="input" id="employment_type" name="employment_type" required>
                    {{$et := ""}}{{if .Job}}{{$et = .Job.EmploymentType}}{{end}}
                    <option value="full_time" {{if eq $et "full_time"}}selected{{end}}>Full Time</option>
                    <option value="part_time" {{if eq $et "part_time"}}selected{{end}}>Part Time</option>
                    <option value="contract" {{if eq $et "contract"}}selected{{end}}>Contract</option>
                    <option value="internship" {{if eq $et "internship"}}selected{{end}}>Internship</option>
                    <option value="freelance" {{if eq $et "freelance"}}selected{{end}}>Freelance</option>
                </select>
            </div>
            <div>
                <label class="label" for="work_arrangement">Work Arrangement</label>
                <select class="input" id="work_arrangement" name="work_arrangement" required>
                    {{$wa := ""}}{{if .Job}}{{$wa = .Job.WorkArrangement}}{{end}}
                    <option value="onsite" {{if eq $wa "onsite"}}selected{{end}}>On-site</option>
                    <option value="remote" {{if eq $wa "remote"}}selected{{end}}>Remote</option>
                    <option value="hybrid" {{if eq $wa "hybrid"}}selected{{end}}>Hybrid</option>
                </select>
            </div>
        </div>
        <div>
            <label class="label" for="location">Location</label>
            <input class="input" type="text" id="location" name="location" value="{{if .Job}}{{.Job.Location}}{{end}}" required>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
            <div>
                <label class="label" for="salary_min">Salary Min (opsional)</label>
                <input class="input" type="number" id="salary_min" name="salary_min" value="{{if and .Job .Job.SalaryMin}}{{.Job.SalaryMin}}{{end}}">
            </div>
            <div>
                <label class="label" for="salary_max">Salary Max (opsional)</label>
                <input class="input" type="number" id="salary_max" name="salary_max" value="{{if and .Job .Job.SalaryMax}}{{.Job.SalaryMax}}{{end}}">
            </div>
        </div>
        <div>
            <label class="label" for="description">Description</label>
            <textarea class="input" id="description" name="description" rows="4" required>{{if .Job}}{{.Job.Description}}{{end}}</textarea>
        </div>
        <div>
            <label class="label" for="requirements">Requirements</label>
            <textarea class="input" id="requirements" name="requirements" rows="4" required>{{if .Job}}{{.Job.Requirements}}{{end}}</textarea>
        </div>
        <div>
            <label class="label" for="benefits">Benefits</label>
            <textarea class="input" id="benefits" name="benefits" rows="3">{{if .Job}}{{.Job.Benefits}}{{end}}</textarea>
        </div>
        <div>
            <label class="label" for="closing_date">Closing Date</label>
            <input class="input" type="date" id="closing_date" name="closing_date" value="{{if .Job}}{{.Job.ClosingDate.Format "2006-01-02"}}{{end}}" required>
        </div>
        <div class="flex items-center gap-3 pt-2">
            <button type="submit" class="btn-primary px-6 py-2.5">{{if .IsEdit}}Simpan Perubahan{{else}}Publikasikan Lowongan{{end}}</button>
            <a href="/recruiter/jobs" class="btn-secondary px-6 py-2.5">Batal</a>
        </div>
    </form>

    {{if and .IsEdit (eq .Job.Status "open")}}
    <form method="POST" action="/recruiter/jobs/{{.Job.ID}}/close" class="mt-6 pt-6 border-t border-slate-100"
          onsubmit="return confirm('Tutup lowongan ini? Semua lamaran wajib memiliki status akhir setelah ditutup.');">
        <button type="submit" class="text-sm text-red-600 hover:underline">Tutup lowongan ini</button>
    </form>
    {{end}}
    </div>
</section>
{{end}}
