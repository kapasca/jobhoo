{{define "content"}}
<section class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-12 lg:py-20">
    <div class="card overflow-hidden bg-white p-8 lg:p-10">
        <div class="grid items-center gap-10 lg:grid-cols-[0.9fr_1.1fr]">
            <div class="space-y-5">
                <span class="section-kicker">Choose your path</span>
                <h1 class="section-title">Daftar ke JOBHOO</h1>
                <p class="section-copy max-w-md">Dua jalur. Satu platform.</p>
                <img src="/static/img/jobhoo-title.png" alt="JOBHOO" class="h-14 w-auto object-contain">
                <p class="text-sm text-slate-500">Pilih role Anda.</p>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
                <a href="/register/candidate" class="card group p-6 hover:-translate-y-1">
                    <span class="badge bg-brand-50 text-brand-700 border border-brand-100">Candidate</span>
                    <span class="mt-4 block text-lg font-display font-bold text-slate-950">Cari kerja.</span>
                    <span class="mt-2 block text-sm leading-6 text-slate-600">Apply cepat.</span>
                    <span class="mt-6 block text-sm font-semibold text-brand-600 transition group-hover:translate-x-0.5">Daftar sebagai Candidate →</span>
                </a>
                <a href="/register/recruiter" class="card group p-6 bg-slate-950 text-white hover:-translate-y-1">
                    <span class="badge border border-white/10 bg-white/10 text-white">Recruiter</span>
                    <span class="mt-4 block text-lg font-display font-bold">Cari talent.</span>
                    <span class="mt-2 block text-sm leading-6 text-white/75">Screen lebih rapi.</span>
                    <span class="mt-6 block text-sm font-semibold text-brand-100 transition group-hover:translate-x-0.5">Daftar sebagai Recruiter →</span>
                </a>
            </div>
        </div>

        <p class="mt-8 text-center text-sm text-slate-500">
            Sudah punya akun? <a href="/login" class="font-semibold text-slate-950 underline decoration-brand-300 underline-offset-4">Masuk</a>
        </p>
    </div>
</section>
{{end}}
